name: StackOS C3 signed updates
on:
  push:
    branches: [main, feature/c3-native-testing-cycle, feature/c3-native-security-components]
    paths: ['c3/**', 'ci/verify_c3.py', 'ci/c3-native/**', '.github/workflows/c3-updates.yml']
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      approve_production:
        description: 'Explicitly authorize deployment of the verified production C3 APT repository'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: c3-signed-publication
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify C3 signatures and every indexed package
        run: python3 ci/verify_c3.py c3
      - name: Prepare static signed repository
        run: |
          mkdir -p _site
          cp -a c3 _site/c3
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
          retention-days: 1
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.approve_production == true
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified C3 channel
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  monitor-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: ci/c3-native
      - name: Check official component sources without publishing unqualified ABI updates
        run: python3 ci/c3-native/monitor_components.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c3-component-versions
          path: cycle-out
          retention-days: 30
  iso-build-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: ci/c3-native
      - name: Audit availability of native ISO build inputs (no build or publication)
        run: python3 ci/c3-native/iso_build_readiness.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c3-iso-build-readiness
          path: cycle-out/iso-build-readiness.json
          retention-days: 30
  detect-testing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      refresh: ${{ steps.detect.outputs.refresh }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: ci/c3-native
      - name: Compare official application version with signed Updater-approved state
        id: detect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 ci/c3-native/cloud_cycle.py selftest
          python3 ci/c3-native/cloud_cycle.py detect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c3-detection
          path: cycle-out
          retention-days: 30
  build-testing:
    needs: detect-testing
    if: needs.detect-testing.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: ci/c3-native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c3-detection
          path: cycle-out
      - name: Compile and test real application with native C3 Python and dpkg
        run: python3 ci/c3-native/cloud_cycle.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c3-native-build
          path: cycle-out
          retention-days: 30
  sign-publish-testing:
    outputs:
      testing_commit: ${{ steps.publication.outputs.commit }}
    needs: [detect-testing, build-testing]
    if: >-
      always() && needs.detect-testing.result == 'success' &&
      ((needs.detect-testing.outputs.changed == 'true' && needs.build-testing.result == 'success') ||
       needs.detect-testing.outputs.refresh == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: ci/c3-native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.detect-testing.outputs.changed == 'true' && 'c3-native-build' || 'c3-detection' }}
          path: cycle-out
      - name: Sign native candidate or refresh previously validated archive
        env:
          C3_TEST_SIGNING_KEY: ${{ secrets.C3_TEST_SIGNING_KEY }}
        run: python3 ci/c3-native/cloud_cycle.py sign
      - name: Publish signed candidate only to isolated APT testing branch
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/c3-native/publish_testing.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c3-signed-testing-channel
          path: testing-channel
          retention-days: 30
  client-testing:
    needs: [detect-testing, sign-publish-testing]
    if: always() && needs.sign-publish-testing.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: ci/c3-native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c3-detection
          path: cycle-out
      - name: Prepare host display only; target runtime and libraries remain C3 native
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp -ac > /tmp/c3-xvfb.log 2>&1 &
      - name: Real StackOS Updater detects and installs signed application from HTTPS APT
        env:
          C3_TEST_SNAPSHOT: ${{ needs.sign-publish-testing.outputs.testing_commit }}
        run: python3 ci/c3-native/cloud_cycle.py client
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c3-updater-client-evidence
          path: cycle-out
          retention-days: 30
  record-validated-testing:
    needs: [sign-publish-testing, client-testing]
    if: always() && needs.client-testing.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: ci/c3-native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c3-updater-client-evidence
          path: cycle-out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c3-signed-testing-channel
          path: testing-channel
      - name: Sign approval marker only after actual StackOS Updater installation
        env:
          C3_TEST_SIGNING_KEY: ${{ secrets.C3_TEST_SIGNING_KEY }}
        run: python3 ci/c3-native/cloud_cycle.py approve
      - name: Advance authenticated validated version atomically, retaining older packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/c3-native/publish_testing.py --approved
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c3-validated-testing-channel
          path: testing-channel
          retention-days: 30

  detect-native-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: ci/c3-native
      - name: Authenticate source and security-patch indexes; compare native component version
        id: detect
        run: python3 ci/c3-native/compat/native_component.py detect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c3-native-component-detection
          path: compat-out/detection.json
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.detect.outputs.changed == 'true'
        with:
          name: c3-native-component-authenticated-sources
          path: |
            authenticated-sources/*.tar.*
            authenticated-sources/*-source.json
            authenticated-sources/*-InRelease
          retention-days: 7
  build-native-component:
    needs: detect-native-component
    if: needs.detect-native-component.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: ci/c3-native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c3-native-component-detection
          path: compat-out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c3-native-component-authenticated-sources
          path: authenticated-sources
      - name: Compile security-patched codec using native C3 GCC; rebuild and test lossless encode/decode
        run: python3 ci/c3-native/compat/native_component.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c3-native-component-build
          path: compat-out
          retention-days: 14

  sign-publish-native-component:
    needs: build-native-component
    if: needs.build-native-component.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      testing_commit: ${{ steps.publication.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: ci/c3-native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c3-native-component-build
          path: compat-out
      - name: Sign only qualified native codec using the isolated testing key
        env:
          C3_TEST_SIGNING_KEY: ${{ secrets.C3_TEST_SIGNING_KEY }}
        run: python3 ci/c3-native/compat/native_channel.py sign
      - name: Publish signed codec inside isolated testing subdirectory
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/c3-native/compat/native_channel.py publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c3-signed-native-codec-channel
          path: compat-channel
          retention-days: 30
  client-native-component:
    needs: sign-publish-native-component
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: ci/c3-native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c3-native-component-build
          path: compat-out
      - name: Install genuine absent ABI7 from signed HTTPS APT in disposable native C3
        env:
          C3_TEST_SNAPSHOT: ${{ needs.sign-publish-native-component.outputs.testing_commit }}
        run: python3 ci/c3-native/compat/native_channel.py client
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c3-native-codec-client-evidence
          path: compat-out
          retention-days: 30
  record-validated-native-component:
    needs: [sign-publish-native-component, client-native-component]
    if: needs.client-native-component.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: ci/c3-native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c3-signed-native-codec-channel
          path: compat-channel
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c3-native-codec-client-evidence
          path: compat-out
      - name: Approve only after signed APT install and real lossless codec execution
        env:
          C3_TEST_SIGNING_KEY: ${{ secrets.C3_TEST_SIGNING_KEY }}
        run: python3 ci/c3-native/compat/native_channel.py approve
      - name: Record signed codec qualification without modifying production
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/c3-native/compat/native_channel.py publish --approved
