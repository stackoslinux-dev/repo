name: StackOS C3 signed updates
on:
  push:
    branches: [main, feature/c3-native-testing-cycle]
    paths: ['c3/**', 'ci/verify_c3.py', 'ci/c3-native/**', '.github/workflows/c3-updates.yml']
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c3-signed-publication
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify C3 signatures and every indexed package
        run: python3 ci/verify_c3.py c3
      - name: Prepare static signed repository
        run: |
          mkdir -p _site
          cp -a c3 _site/c3
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
          retention-days: 1
  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified C3 channel
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  detect-testing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate category policy and compare official application versions
        id: detect
        run: |
          python3 ci/c3-native/cloud_cycle.py selftest
          python3 ci/c3-native/cloud_cycle.py detect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c3-detection
          path: cycle-out
          retention-days: 30
  build-testing:
    needs: detect-testing
    if: needs.detect-testing.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c3-detection
          path: cycle-out
      - name: Compile real application using native C3 Python and dpkg
        run: python3 ci/c3-native/cloud_cycle.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c3-native-build
          path: cycle-out
          retention-days: 30
  sign-publish-testing:
    needs: build-testing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c3-native-build
          path: cycle-out
      - name: Sign approved native package with isolated testing key
        env:
          C3_TEST_SIGNING_KEY: ${{ secrets.C3_TEST_SIGNING_KEY }}
        run: python3 ci/c3-native/cloud_cycle.py sign
      - name: Publish only the c3-testing branch as one Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/c3-native/publish_testing.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c3-signed-testing-channel
          path: testing-channel
          retention-days: 30
  client-testing:
    needs: sign-publish-testing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c3-detection
          path: cycle-out
      - name: Prepare headless display only (target libraries remain C3 native)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp -ac > /tmp/c3-xvfb.log 2>&1 &
      - name: Real StackOS Updater detects and installs the signed BugReport update
        run: python3 ci/c3-native/cloud_cycle.py client
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c3-updater-client-evidence
          path: |
            cycle-out
            c3-root/work/updater-*.json
            c3-root/var/log/stackos-updater.log
          retention-days: 30
