name: StackOS C3 agent self-audit
on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'ci/c3-native/agent_*.py'
      - 'ci/c3-native/test_agent_*.py'
      - '.github/workflows/c3-agent-self-audit.yml'
permissions:
  contents: read
  actions: read
  models: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test diagnostic classification
        run: python3 -m unittest discover -s ci/c3-native -p 'test_agent_*.py'
      - name: Inspect recent native C3 workflow results
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/c3-native/agent_self_audit.py
      - name: Classify failed jobs without executing their logs
        if: github.event_name != 'pull_request' && always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/c3-native/agent_triage.py
      - name: Optional free-tier model advice
        if: github.event_name != 'pull_request' && always()
        env:
          STACKOS_AI_TOKEN: ${{ secrets.STACKOS_AI_TOKEN || github.token }}
        run: python3 ci/c3-native/agent_ai_advice.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c3-agent-self-audit
          path: |
            cycle-out/agent-self-audit.json
            cycle-out/agent-triage.json
            cycle-out/agent-ai-advice.json
          retention-days: 30
